name: Heartbeat

# Two jobs the deployment cannot do for itself.
#
# 1. WARM. Measured on production: a cold request took 3.5s, a warm one 0.27s,
#    and the first database connection a further ~3.7s against the shared-tier
#    cluster. The admin panel is used in short bursts with long gaps, so nearly
#    every visit paid the cold path. Pinging keeps an instance and its connection
#    pool alive.
#
# 2. RUN QUEUED JOBS. /api/cron/run is the job runner, and it is driven by an
#    external scheduler by design. Every recurring automation — discovery,
#    enrichment, drafts, reports, pings — is enqueued from this tick.
#
# Why GitHub Actions rather than Vercel Cron: Vercel's Hobby plan limits cron to
# once per day, which is useless for warming and leaves daily automations hours
# late. This runs on any plan and costs nothing.
#
# GitHub does not guarantee punctual scheduling and drops runs when the runner
# fleet is busy, which is fine: warming is best-effort, and the job runner is
# idempotent per time bucket. The server records every tick, and /api/health
# reports a stalled scheduler instead of silently showing green.
#
# A missing CRON_SECRET is a hard failure on purpose. A warning-only branch made
# "automation is off" look like a passing workflow, which is how a deployment
# can go weeks without processing a single job.

on:
  schedule:
    # Every 5 minutes — the shortest interval GitHub accepts.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  # Never stack heartbeats: a slow run must not overlap the next tick.
  group: heartbeat
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    # The job runner's own budget is 270s and a follow-up pass shares the
    # function's 300s maxDuration; 10 minutes leaves room for curl, retries and
    # a slow cold start without the workflow killing a legitimate run.
    timeout-minutes: 10
    steps:
      - name: Warm the deployment and its database connection
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.bitecodes.com' }}
        run: |
          code=$(curl -sS -o /tmp/warm.json -w '%{http_code}' \
            --max-time 45 --retry 2 --retry-delay 5 \
            "$SITE_URL/api/warm") || true
          echo "status=$code"
          # Never print the body: it may name internal capability states.
          # Warming is best effort, and a blip here must not turn the repository
          # red. The authenticated job-runner step below is the real check.
          if [ "$code" != "200" ]; then
            echo "::warning::warm-up returned $code"
          fi

      - name: Run due jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.bitecodes.com' }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is not set. Automation cannot run without it."
            echo "Set the repository secret CRON_SECRET to the same value as the deployment's CRON_SECRET."
            exit 1
          fi

          code=$(curl -sS -o /tmp/cron.json -w '%{http_code}' \
            --max-time 290 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/run") || true
          echo "status=$code"

          # The body is summarised, never printed raw: it names job activity and
          # this log is readable by anyone who can read the repository.
          python3 - <<'PY'
          import json
          import sys

          try:
              with open("/tmp/cron.json", encoding="utf-8") as fh:
                  data = json.load(fh)
          except Exception:
              print("::error::job runner returned an unparseable response")
              sys.exit(1)

          queue = data.get("queue") or {}
          print(
              "ok:", data.get("ok"),
              "| ran:", data.get("ran", data.get("claimed")),
              "| failed:", data.get("failed"),
              "| deferred:", data.get("deferred"),
              "| queued:", queue.get("queued"),
          )
          if data.get("ok") is not True:
              print("::error::job runner reported ok=false")
              sys.exit(1)
          PY

          if [ "$code" != "200" ]; then
            echo "::error::job runner returned $code"
            exit 1
          fi
