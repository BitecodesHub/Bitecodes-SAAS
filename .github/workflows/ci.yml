name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      # A real MongoDB so the database integration suites run here even when a
      # developer's machine has none. Without this they would only ever skip.
      # Pinned: MongoDB 8.x images crash on the runner kernel 6.19+ because of
      # a vendored TCMalloc incompatibility (SERVER-121912). 7.0.41 is exempt
      # from that check, and the application tests against the 7.x driver.
      mongodb:
        image: mongo:7.0.41
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Test-only values. Nothing here reaches a real service: the suites that
      # need SMTP or OpenRouter stub the transport.
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB_NAME: bitecodes_ci
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: ci
      SMTP_PASSWORD: ci
      SMTP_FROM: Bitecodes <ci@example.com>
      CONTACT_NOTIFICATION_TO: ci@example.com
      AUTH_SECRET: ci-secret-at-least-32-characters-long-0000
      CRON_SECRET: ci-cron-secret-16-plus
      SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Test
        # Run once. The assertion greps the positive marker the global setup
        # prints when a test database is configured, so a silent harness
        # regression (every database suite becoming a skip) fails the build
        # instead of leaving it green. Grepping for the *absence* warning was
        # vacuous because CI always sets TEST_MONGODB_URI.
        run: |
          pnpm test 2>&1 | tee /tmp/test-output.txt
          if ! grep -q "database integration suites will run" /tmp/test-output.txt; then
            echo "::error::Database integration suites did not run in CI."
            exit 1
          fi

      - name: Build
        run: pnpm build
